services:
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile

    # Internal service - only accessible to other containers
    expose:
      - "8081"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8081/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  event-gateway:
    build:
      context: ./event-gateway
      dockerfile: Dockerfile

    # Public API
    ports:
      - "8080:8080"

    environment:
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8081

    depends_on:
      account-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s